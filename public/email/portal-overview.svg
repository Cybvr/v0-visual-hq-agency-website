<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Your VisualCNS client portal</title>
  <desc id="d">A client overview screen showing recent projects and their status inside the VisualCNS portal.</desc>

  <rect width="1200" height="675" rx="28" fill="#EAE8E3"/>

  <!-- card shadow + card -->
  <rect x="140" y="140" width="920" height="470" rx="22" fill="#000000" opacity="0.05"/>
  <rect x="140" y="130" width="920" height="470" rx="22" fill="#FFFFFF"/>

  <!-- breadcrumb -->
  <text x="184" y="196" fill="#9AA1AE" font-family="Inter, Arial, sans-serif" font-size="15">Clients</text>
  <text x="248" y="196" fill="#9AA1AE" font-family="Inter, Arial, sans-serif" font-size="15">/</text>
  <text x="262" y="196" fill="#0F1A3A" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Smith Co.</text>

  <!-- profile -->
  <rect x="184" y="214" width="58" height="58" rx="14" fill="#EAF0FF"/>
  <rect x="200" y="230" width="26" height="26" rx="7" fill="#2856D9"/>
  <text x="262" y="242" fill="#0F1A3A" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="-0.6">Smith Co.</text>
  <rect x="262" y="253" width="98" height="24" rx="12" fill="#EAF0FF"/>
  <text x="276" y="269" fill="#2856D9" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Subscription</text>
  <rect x="368" y="253" width="60" height="24" rx="12" fill="#F2F3F5"/>
  <text x="382" y="269" fill="#6B7280" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Client</text>

  <!-- tabs -->
  <text x="184" y="326" fill="#0F1A3A" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Overview</text>
  <rect x="184" y="338" width="66" height="3" rx="1.5" fill="#2856D9"/>
  <text x="286" y="326" fill="#9AA1AE" font-family="Inter, Arial, sans-serif" font-size="15">Projects</text>
  <text x="372" y="326" fill="#9AA1AE" font-family="Inter, Arial, sans-serif" font-size="15">Files</text>
  <text x="432" y="326" fill="#9AA1AE" font-family="Inter, Arial, sans-serif" font-size="15">Tasks</text>
  <text x="502" y="326" fill="#9AA1AE" font-family="Inter, Arial, sans-serif" font-size="15">Billing</text>
  <line x1="184" y1="354" x2="1016" y2="354" stroke="#EEF0F4" stroke-width="1"/>

  <!-- recent projects -->
  <text x="184" y="396" fill="#0F1A3A" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Recent Projects</text>
  <circle cx="1006" cy="390" r="14" fill="#EAF0FF"/>
  <path d="M1006 384v12M1000 390h12" stroke="#2856D9" stroke-width="2" stroke-linecap="round"/>

  <!-- row 1 -->
  <text x="184" y="440" fill="#0F1A3A" font-family="Inter, Arial, sans-serif" font-size="15">Consulting Project</text>
  <rect x="912" y="426" width="104" height="26" rx="13" fill="#EAF0FF"/>
  <circle cx="930" cy="439" r="4" fill="#2856D9"/>
  <text x="942" y="443" fill="#2856D9" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Ready</text>
  <line x1="184" y1="462" x2="1016" y2="462" stroke="#F2F3F5" stroke-width="1"/>

  <!-- row 2 -->
  <text x="184" y="500" fill="#0F1A3A" font-family="Inter, Arial, sans-serif" font-size="15">Website Refresh</text>
  <rect x="890" y="486" width="126" height="26" rx="13" fill="#F2F3F5"/>
  <circle cx="908" cy="499" r="4" fill="#6B7280"/>
  <text x="920" y="503" fill="#6B7280" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">In progress</text>
  <line x1="184" y1="522" x2="1016" y2="522" stroke="#F2F3F5" stroke-width="1"/>

  <!-- row 3 -->
  <text x="184" y="560" fill="#0F1A3A" font-family="Inter, Arial, sans-serif" font-size="15">Marketing Plan</text>
  <rect x="906" y="546" width="110" height="26" rx="13" fill="#F2F3F5"/>
  <circle cx="924" cy="559" r="4" fill="#6B7280"/>
  <text x="936" y="563" fill="#6B7280" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">In review</text>
</svg>
