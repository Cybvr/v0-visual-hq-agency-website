allowBuilds:
  '@firebase/util': set this to true or false
  '@google/genai': set this to true or false
  '@tailwindcss/oxide': set this to true or false
  protobufjs: set this to true or false
  sharp: set this to true or false

# firebase-admin@14 pulls jwks-rsa@4, which currently loads jose with
# require(). Keep that transitive dependency on the CommonJS-compatible line
# so the Vercel serverless function can verify Firebase ID tokens.
overrides:
  'jwks-rsa>jose': 4.15.9
